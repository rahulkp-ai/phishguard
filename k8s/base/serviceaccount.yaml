# =============================================================================
# ServiceAccount — phishguard
# =============================================================================
#
# Why a dedicated ServiceAccount (not the default)?
# ──────────────────────────────────────────────────
# The `default` ServiceAccount in most clusters has no RBAC bindings, but
# using it makes it harder to add permissions later without affecting other
# workloads sharing the namespace.  A dedicated SA gives us:
#
# - Clear ownership: this SA belongs to PhishGuard only.
# - Token projection: if we add cloud IAM (AWS IRSA / GCP Workload Identity)
#   later, we bind it to this SA specifically.
# - automountServiceAccountToken: false — the pod does not need to call the
#   Kubernetes API, so mounting the SA token is an unnecessary attack surface.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: phishguard
  namespace: phishguard
  labels:
    app.kubernetes.io/name: phishguard
    app.kubernetes.io/component: api
automountServiceAccountToken: false
