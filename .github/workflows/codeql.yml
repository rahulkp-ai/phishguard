# =============================================================================
# PhishGuard — CodeQL Security Analysis
# =============================================================================
#
# CodeQL scans the Python source for security vulnerabilities:
#   - SQL injection, XSS, path traversal (relevant to Flask apps)
#   - Unsafe deserialization (relevant: we previously used pickle)
#   - Hard-coded credentials
#   - Uncontrolled format strings
#   - SSRF vulnerabilities (relevant: we make outbound HTTP requests in downloader.py)
#
# Runs on:
#   - push to main
#   - PRs to main
#   - Weekly schedule (catches newly-discovered vulnerability patterns)
#
# Results appear in the GitHub Security tab → Code scanning alerts.
# =============================================================================

name: CodeQL Security Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 08:00 UTC — catches new vulnerability patterns
    # even when no code has changed
    - cron: "0 8 * * 1"

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      actions: read
      contents: read
      security-events: write    # required to upload SARIF results

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Use the security-extended query suite for broader coverage
          # beyond the default security queries
          queries: security-extended,security-and-quality

      # CodeQL auto-builds Python by tracing imports — no manual build step needed
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
          # Upload results to GitHub Security tab
          upload: true
