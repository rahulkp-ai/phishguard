# =============================================================================
# Keep-Alive — prevents Render free tier spin-down
# =============================================================================
#
# Render free tier spins down after 15 minutes of inactivity.
# The first request after spin-down takes 30–60 seconds to respond — bad UX.
#
# This workflow pings /api/health every 14 minutes using GitHub Actions
# scheduled workflows (free for public repos).
#
# Setup:
#   1. Deploy to Render and get your URL (e.g. https://phishguard.onrender.com)
#   2. Add it as a repository secret:
#        Settings → Secrets → New secret
#        Name:  RENDER_URL
#        Value: https://phishguard.onrender.com
#   3. Push this file — GitHub will run it automatically
#
# Cost: $0. GitHub Actions cron jobs are free for public repos.
#
# Note: GitHub Actions cron precision is ±a few minutes — this is fine.
# The goal is staying under 15 min, not exact timing.
# =============================================================================

name: Keep Alive (Render)

on:
  schedule:
    # Runs every 14 minutes to stay under Render's 15-minute idle spin-down threshold
    - cron: "*/14 * * * *"
  workflow_dispatch:    # Allows manual testing in the GitHub Actions tab

jobs:
  ping:
    name: Ping Render Service
    runs-on: ubuntu-latest
    timeout-minutes: 3 # Increased slightly to cover the cold start window

    steps:
      - name: Ping /api/health
        run: |
          # Use your target URL as a fallback if the secret isn't configured yet
          URL="${{ secrets.RENDER_URL }}"
          if [[ -z "$URL" ]]; then
            URL="https://phishguard-xozj.onrender.com"
          fi

          echo "Pinging $URL/api/health ..."
          
          # Increased --max-time to 60 seconds to allow Render's cold start to complete
          RESPONSE=$(curl --silent --show-error --max-time 60 --write-out "\n%{http_code}" "$URL/api/health")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)

          echo "Status: $HTTP_CODE"
          echo "Body:   $BODY"

          # Accept 200 OK, but also accept other standard success/redirect codes 
          # just in case your health endpoint behaves differently
          if [[ "$HTTP_CODE" =~ ^(200|301|302|307|308)$ ]]; then
            echo "Service is alive and responding."
          else
            echo "WARNING: Unexpected status $HTTP_CODE"
            # We don't exit 1 here so your workflow history stays green, 
            # but you'll see the warning in the logs if it failed to wake up.
          fi
