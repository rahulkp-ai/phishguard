# =============================================================================
# PhishGuard — Automated Release
# =============================================================================
#
# Triggered by pushing a semver tag: git tag v1.2.3 && git push --tags
#
# What this workflow does
# ───────────────────────
# 1. Runs the full test suite (safety gate before any release artifact is created).
# 2. Builds the source distribution and wheel.
# 3. Creates a GitHub Release with:
#    - Auto-generated changelog from PR titles and commit messages since last tag.
#    - The wheel and sdist as downloadable release assets.
#    - The Docker image digest from the GHCR push (triggered by the same tag
#      in docker-publish.yml).
#
# Release naming convention
# ─────────────────────────
#   v1.0.0  — major release (breaking changes)
#   v1.1.0  — minor release (new features, backward-compatible)
#   v1.1.1  — patch release (bug fixes)
#
# Usage
# ─────
#   git tag v1.0.0 -m "Initial production release"
#   git push origin v1.0.0
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"    # matches v1.0.0, v2.1.3, etc.

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Safety gate — full test suite must pass before any release artifact ships
  # ---------------------------------------------------------------------------
  test:
    name: Release Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest tests/ --tb=short -q
        env:
          SECRET_KEY: release-testing-secret

  # ---------------------------------------------------------------------------
  # Build Python distribution artifacts
  # ---------------------------------------------------------------------------
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tool
        run: pip install build

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution contents
        run: |
          pip install twine
          twine check dist/*
          echo "Distribution files:"
          ls -lh dist/

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 5

  # ---------------------------------------------------------------------------
  # Create GitHub Release
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build]

    permissions:
      contents: write       # required to create GitHub Releases
      packages: read        # required to read GHCR image metadata

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history needed for changelog generation

      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Auto-generate release notes from PR titles and commit messages
          # since the last tag — no manual CHANGELOG editing required.
          generate_release_notes: true
          name: "PhishGuard v${{ steps.version.outputs.version }}"
          body: |
            ## PhishGuard v${{ steps.version.outputs.version }}

            ### Docker
            Pull the image for this release:
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/phishguard:${{ steps.version.outputs.version }}
            ```

            Verify the image signature:
            ```bash
            cosign verify \
              --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              ghcr.io/${{ github.repository_owner }}/phishguard:${{ steps.version.outputs.version }}
            ```

            ### Install from source
            ```bash
            pip install phishguard==${{ steps.version.outputs.version }}
            ```

            ---
            *Full changelog below is auto-generated from merged PRs and commits.*
          files: |
            dist/*.whl
            dist/*.tar.gz
          # Mark as pre-release if tag contains alpha/beta/rc
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}

      - name: Release summary
        run: |
          echo "## Release v${{ steps.version.outputs.version }} Created" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Assets:**" >> $GITHUB_STEP_SUMMARY
          ls dist/ | while read f; do echo "- \`$f\`"; done >> $GITHUB_STEP_SUMMARY
