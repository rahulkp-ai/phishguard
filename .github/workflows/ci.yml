# =============================================================================
# PhishGuard — Continuous Integration
# =============================================================================
#
# Jobs (in order of execution)
# ─────────────────────────────
#   lint          ruff + black --check  (fails fast, ~10s)
#   test-fast     unit tests only, --fast flag, no coverage  (~30s)
#   test-full     full suite including integration + coverage gate  (~60s)
#   docker-check  verify the Dockerfile builds without error  (~3 min)
#
# Design decisions
# ─────────────────
# - lint and test-fast run in parallel — fastest possible feedback.
# - test-full depends on test-fast so we don't waste a runner slot if
#   unit tests are already failing.
# - docker-check only runs on push to main/develop (not PRs from forks)
#   to avoid burning free minutes on external contributor drafts.
# - Coverage results are uploaded to Codecov AND posted as a PR comment
#   via the coverage artifact, so reviewers see coverage delta inline.
# - Python version matrix: 3.10 and 3.12. We support 3.10 (minimum per
#   pyproject.toml) and test on 3.12 (what the Docker image uses).
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Cancel in-progress runs for the same branch on new push.
# Prevents stale CI jobs consuming runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1 — Lint & Format
  # Runs standalone so it fails fast without waiting for tests.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff black

      - name: Ruff — lint
        run: ruff check src/ app/ tests/ scripts/

      - name: Black — format check
        run: black --check src/ app/ tests/ scripts/

  # ---------------------------------------------------------------------------
  # Job 2 — Fast unit tests (no integration, no coverage)
  # Runs in parallel with lint for tight feedback loop.
  # Matrix: Python 3.10 and 3.12 to catch compatibility issues early.
  # ---------------------------------------------------------------------------
  test-fast:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run fast unit tests
        run: pytest tests/ --fast -v --tb=short
        env:
          SECRET_KEY: ci-testing-secret

  # ---------------------------------------------------------------------------
  # Job 3 — Full test suite with coverage gate
  # Depends on test-fast passing — don't burn minutes if units are broken.
  # Only runs on the default Python version to avoid double coverage reports.
  # ---------------------------------------------------------------------------
  test-full:
    name: Full Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-fast

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ env.PYTHON_DEFAULT }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run full test suite with coverage
        run: |
          pytest tests/ \
            --cov \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            -v
        env:
          SECRET_KEY: ci-testing-secret

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 14

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Summary job — single required status check for branch protection rules
  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs: [lint, test-fast, test-full]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "lint failed" && exit 1
          fi
          if [[ "${{ needs.test-fast.result }}" != "success" ]]; then
            echo "test-fast failed" && exit 1
          fi
          if [[ "${{ needs.test-full.result }}" != "success" ]]; then
            echo "test-full failed" && exit 1
          fi
          echo "All required CI jobs passed."
