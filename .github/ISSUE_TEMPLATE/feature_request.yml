name: Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
      description: What problem or limitation does this feature address?
      placeholder: "Currently there's no way to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you'd like to see.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of the project
      options:
        - "Feature extraction (extractor.py)"
        - "API endpoint (routes.py)"
        - "Model training pipeline"
        - "Docker / deployment"
        - "CI/CD"
        - "Documentation"
        - "Other"
    validations:
      required: true
